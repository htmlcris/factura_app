<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura Lico 5to A</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="factura.js" defer></script>
</head>
<body class="bg-light py-4">

<div class="container">
    <!-- Título Principal -->
    <h2 class="text-center mb-4 text-primary fw-bold">Factura Lico 5to A</h2>

    <div class="row g-4">
        
        <!-- Sección de Datos del Cliente -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-secondary text-white fw-bold">Datos del Cliente</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Cliente</label>
                        <input type="text" id="nombreCliente" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cédula</label>
                        <input type="text" id="cedulaCliente" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Sexo</label>
                        <input type="text" id="sexoCliente" class="form-control">
                    </div>
                </div>
            </div>
        </div>

        <!-- Sección de Agregar Productos -->
        <div class="col-md-8">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-primary text-white fw-bold">Agregar Productos</div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Producto</label>
                            <input type="text" id="producto" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Cantidad</label>
                            <input type="number" id="cantidad" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Precio</label>
                            <input type="number" id="precio" class="form-control">
                        </div>
                        <div class="col-12 mt-3">
                            <button id="btnAgregar" class="btn btn-success w-100">Agregar Producto</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Sección de Lista de Productos (Tabla) -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white fw-bold">Lista de Productos</div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0 align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Precio</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="detalleFactura">
                                <tr>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sección de Resumen de la Factura -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="card shadow-sm border-0 bg-white">
                <div class="card-body text-end p-4">
                    <h4 class="text-secondary mb-3">Resumen de la Factura</h4>
                    <h5 id="subtotal" class="text-dark">Subtotal: $0.00</h5>
                    <h5 id="iva" class="text-dark">IVA: 15%: $0.00</h5>
                    <h3 id="total" class="text-danger fw-bold mt-2">Total: $0.00</h3>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
