<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="form.js" defer></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    
    <div class="container" style="max-width: 500px;">
        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-header bg-primary text-white text-center py-3 rounded-top-3">
                <h4 class="card-title mb-0">Formulario de Registro</h4>
            </div>
            <div class="card-body p-4 p-md-5">
                <form>
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-semibold">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan Pérez" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="edad" class="form-label fw-semibold">Edad:</label>
                        <!-- Campo de edad cambiado a tipo texto -->
                        <input type="text" class="form-control" id="edad" placeholder="Ej. 25 o Veinticinco" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="mensaje" class="form-label fw-semibold">Mensaje:</label>
                        <!-- Área de texto en lugar de membresía -->
                        <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
